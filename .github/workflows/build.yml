name: Build PageFlow APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key (only if all four secrets exist)
        if: env.HAS_KEYSTORE == 'true'
        env:
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$S_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pageflow.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/pageflow.jks"
            echo "KEYSTORE_PASSWORD=$S_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$S_KEY_ALIAS"
            echo "KEY_PASSWORD=$S_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Signing mode
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "::notice::Persistent signing key found: debug and release APKs will be signed with it."
          else
            echo "::warning::No signing secrets configured. Building DEBUG APK only (default debug key). See README, step 'Signing'."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Build release APK (signed; only when a key is configured)
        if: env.HAS_KEYSTORE == 'true'
        run: gradle assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PageFlow-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

name: Build PageFlow APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Restore signing key (only if all four secrets exist)
        if: env.HAS_KEYSTORE == 'true'
        env:
          S_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$S_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pageflow.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/pageflow.jks"
            echo "KEYSTORE_PASSWORD=$S_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$S_KEY_ALIAS"
            echo "KEY_PASSWORD=$S_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Signing mode
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "::notice::Persistent signing key found: debug and release APKs will be signed with it."
          else
            echo "::warning::No signing secrets configured. Building DEBUG APK only (default debug key). See README, step 'Signing'."
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee gradle-debug.log

      - name: Build release APK (signed; only when a key is configured)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee gradle-release.log

      # Make failures readable without signing in: the compiler / test errors become annotations on the run page.
      - name: Report errors
        if: failure()
        run: |
          for f in gradle-test.log gradle-debug.log gradle-release.log; do
            [ -f "$f" ] || continue
            errs=$(grep -E '^e: |error: |FAILED$|AssertionError|What went wrong|Execution failed|Could not (resolve|find)|Unresolved reference' "$f" \
              | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | cut -c1-300 | awk '!seen[$0]++' | head -25)
            [ -n "$errs" ] || continue
            {
              echo "### Errors from $f"
              echo '```'
              echo "$errs"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            enc=$(printf '%s' "$errs" | sed -e 's/%/%25/g' -e 's/\r//g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=Errors in $f::$enc"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: PageFlow-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-logs
          path: gradle-*.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

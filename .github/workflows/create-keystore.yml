name: Create signing key (run once)

# Generates a permanent release key with random passwords and hands it to you as a
# short-lived private artifact. You then store the 4 values as repository Secrets.
# Nothing secret is printed in the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          set -e
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore out/pageflow-release.jks -alias pageflow \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=PageFlow, O=PageFlow"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=pageflow"
            echo "KEY_PASSWORD=$PASS"
            echo
            echo "KEYSTORE_BASE64 is in the file keystore-base64.txt (one long line)."
          } > out/SECRETS-READ-ME.txt
          base64 -w0 out/pageflow-release.jks > out/keystore-base64.txt
      - uses: actions/upload-artifact@v6
        with:
          name: PageFlow-signing-key-KEEP-PRIVATE
          path: out/
          retention-days: 1
